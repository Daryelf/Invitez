<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8eddc">
  <title>Share a Memory | Invitez</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; background: #e8eddc; }
    body { margin: 0; }
    button, input { font: inherit; }
    .language-gate {
      --ink: #173c32;
      position: relative;
      display: grid;
      width: min(calc(100% - 32px), 540px);
      min-height: calc(100dvh - max(36px, env(safe-area-inset-top)) - 64px - env(safe-area-inset-bottom));
      place-items: center;
      align-content: center;
      gap: 18px;
      margin: max(18px, env(safe-area-inset-top)) auto calc(64px + env(safe-area-inset-bottom));
      padding: 38px 24px;
      border: 1px solid rgba(23, 60, 50, .14);
      border-radius: 30px;
      color: var(--ink);
      background: rgba(255, 249, 237, .96);
      box-shadow: 0 26px 70px rgba(45, 66, 45, .18);
      text-align: center;
    }
    .language-gate[hidden], .page[hidden] { display: none; }
    .language-monogram { display: grid; width: 72px; aspect-ratio: 1; place-items: center; border-radius: 50%; color: #fff8ec; background: var(--ink); font: 38px Georgia, serif; }
    .language-gate > p { margin: 0; color: #a17d80; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .language-gate h1 { margin: 0; font: 400 clamp(2.35rem, 10vw, 4.25rem)/1 Georgia, "Times New Roman", serif; letter-spacing: -.045em; }
    .language-gate h1 em { color: #c98591; font-weight: 400; }
    .language-choices { display: grid; width: min(100%, 390px); gap: 12px; margin-top: 12px; }
    .language-choices button { display: grid; gap: 4px; min-height: 78px; padding: 14px 20px; border: 1px solid rgba(23, 60, 50, .18); border-radius: 16px; color: var(--ink); background: #fffdf8; cursor: pointer; text-align: left; }
    .language-choices button:focus-visible { outline: 3px solid rgba(212, 139, 152, .4); outline-offset: 3px; }
    .language-choices strong { font: 500 24px Georgia, serif; }
    .language-choices span { color: #6d7c64; font-size: 14px; }
    .page {
      --ink: #173c32;
      --sage: #829475;
      position: relative;
      min-height: 100dvh;
      overflow-x: hidden;
      padding: max(18px, env(safe-area-inset-top)) 16px calc(64px + env(safe-area-inset-bottom));
      color: var(--ink);
      background: #e8eddc;
    }
    .header {
      position: relative;
      z-index: 1;
      display: flex;
      width: min(100%, 680px);
      align-items: center;
      gap: 11px;
      margin: 0 auto 16px;
      padding: 2px 3px;
    }
    .language-switch { min-width: 42px; min-height: 36px; margin-left: auto; border: 1px solid rgba(23, 60, 50, .2); border-radius: 999px; color: var(--ink); background: rgba(255, 249, 237, .78); cursor: pointer; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .monogram { display: grid; width: 40px; aspect-ratio: 1; place-items: center; border-radius: 50%; color: #fff8ec; background: var(--ink); font: 22px Georgia, serif; }
    .header div { display: grid; }
    .header strong { font: 500 16px Georgia, serif; }
    .header small { color: #6d7c64; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
    .card {
      position: relative;
      z-index: 1;
      display: grid;
      width: min(100%, 680px);
      gap: 28px;
      margin: 0 auto;
      padding: clamp(24px, 6vw, 44px);
      overflow: hidden;
      border: 1px solid rgba(23, 60, 50, .14);
      border-radius: 30px;
      background: rgba(255, 249, 237, .94);
      box-shadow: 0 26px 70px rgba(45, 66, 45, .18);
    }
    .card::after { content: ""; position: absolute; width: 160px; aspect-ratio: 1; top: -96px; right: -76px; border: 42px solid rgba(226, 145, 161, .12); border-radius: 50%; pointer-events: none; }
    .intro { position: relative; z-index: 1; }
    .intro[hidden], form[hidden] { display: none; }
    h1 { margin: 0; font: 400 clamp(3.35rem, 17vw, 5.8rem)/.8 Georgia, "Times New Roman", serif; letter-spacing: -.055em; }
    h1 em { color: #c98591; font-weight: 400; }
    .intro p { max-width: 520px; margin: 24px 0 0; color: #65745d; font: 1rem/1.65 Georgia, serif; }
    form { position: relative; z-index: 1; display: grid; gap: 16px; }
    .picker {
      position: relative;
      display: grid;
      min-height: 265px;
      place-items: center;
      overflow: hidden;
      border: 1px dashed rgba(23, 60, 50, .34);
      border-radius: 22px;
      color: #61705a;
      background: linear-gradient(145deg, rgba(222, 233, 207, .62), rgba(249, 223, 228, .55));
      cursor: pointer;
      text-align: center;
    }
    .picker.selected { border-style: solid; background: #e8ecdf; }
    .picker input { position: absolute; z-index: 3; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .picker input:disabled { cursor: not-allowed; }
    .prompt { display: grid; place-items: center; gap: 8px; padding: 24px; }
    .prompt i { display: grid; width: 56px; aspect-ratio: 1; place-items: center; border-radius: 50%; color: white; background: var(--sage); font-size: 28px; font-style: normal; font-weight: 200; }
    .prompt strong { margin-top: 5px; font: 500 24px Georgia, serif; }
    .prompt small { font-size: 11px; line-height: 1.45; }
    .previews { position: relative; display: none; width: 100%; height: 100%; min-height: 265px; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; }
    .previews.visible { display: grid; }
    .previews.single { grid-template-columns: 1fr; }
    .previews img, .previews video { width: 100%; height: 100%; min-height: 130px; max-height: 218px; object-fit: cover; }
    .video-preview { position: relative; display: block; min-height: 130px; overflow: hidden; background: #17211d; }
    .video-preview i { position: absolute; left: 9px; top: 9px; padding: 5px 7px; border-radius: 999px; color: #fff; background: rgba(23,60,50,.82); font-size: 9px; font-style: normal; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .previews.single img, .previews.single video, .previews.single .video-preview { min-height: 265px; max-height: 440px; }
    .count { position: absolute; right: 12px; bottom: 12px; padding: 8px 11px; border-radius: 999px; color: #fffaf0; background: rgba(23, 60, 50, .88); box-shadow: 0 4px 14px rgba(23, 60, 50, .22); font-size: 12px; line-height: 1; }
    .add-more { justify-self: center; margin-top: -7px; border: 0; color: #7d6a68; background: transparent; cursor: pointer; font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }
    .add-more[hidden] { display: none; }
    .add-more:disabled { cursor: not-allowed; opacity: .45; }
    .field { display: grid; gap: 8px; }
    .field > span { display: flex; justify-content: space-between; gap: 12px; color: #63705d; font-size: 9px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .field b { font: inherit; }
    .field em { color: #a17d80; font-style: normal; }
    .field input { width: 100%; min-height: 56px; padding: 0 15px; border: 1px solid rgba(23, 60, 50, .18); border-radius: 13px; outline: 0; color: var(--ink); background: #fffdf8; font-size: 16px; }
    .field input:focus { border-color: #d48b98; box-shadow: 0 0 0 3px rgba(212, 139, 152, .15); }
    .field small { color: #788371; font-size: 10px; line-height: 1.45; }
    .message { display: none; margin: 0; padding: 12px 14px; border-radius: 11px; font-size: 12px; line-height: 1.45; }
    .message.visible { display: block; }
    .message.error { color: #8d3947; background: #f7dde1; }
    .message.success { color: #325c49; background: #dcebdc; }
    .submit { min-height: 58px; border: 0; border-radius: 14px; color: #fffaf0; background: var(--ink); cursor: pointer; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .submit:disabled { cursor: not-allowed; opacity: .38; }
    .confirmation { position: relative; z-index: 1; display: grid; grid-column: 1 / -1; min-height: min(520px, 68dvh); place-items: center; align-content: center; gap: 16px; padding: 20px 0; text-align: center; }
    .confirmation[hidden] { display: none; }
    .confirmation-icon { display: grid; width: 76px; aspect-ratio: 1; place-items: center; border-radius: 50%; color: #fffaf0; background: var(--ink); box-shadow: 0 14px 28px rgba(23, 60, 50, .2); font-size: 34px; }
    .confirmation > small { color: #a17d80; font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .confirmation h2 { max-width: 520px; margin: 0; font: 400 clamp(2.8rem, 13vw, 5rem)/.92 Georgia, "Times New Roman", serif; letter-spacing: -.045em; }
    .confirmation p { max-width: 470px; margin: 0; color: #65745d; font: 1rem/1.6 Georgia, serif; }
    .confirmation button { min-height: 56px; margin-top: 8px; padding: 0 24px; border: 0; border-radius: 14px; color: #fffaf0; background: var(--ink); cursor: pointer; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .confirmation button:focus-visible { outline: 3px solid rgba(212, 139, 152, .45); outline-offset: 3px; }
    @media (min-width: 720px) {
      .page { padding-top: 34px; padding-bottom: 48px; }
      .card { grid-template-columns: .8fr 1.2fr; align-items: start; }
      .intro { position: sticky; top: 30px; }
      .picker, .previews { min-height: 330px; }
    }
  </style>
</head>
<body>
  <section class="language-gate" id="language-gate" aria-labelledby="language-title">
    <span class="language-monogram">E</span>
    <p>Welcome · Bienvenidos</p>
    <h1 id="language-title">Choose your language<br><em>Elige tu idioma</em></h1>
    <div class="language-choices">
      <button id="choose-en" type="button"><strong>English</strong><span>Continue in English</span></button>
      <button id="choose-es" type="button" lang="es"><strong>Español</strong><span>Continuar en español</span></button>
    </div>
  </section>
  <main class="page" id="upload-page" hidden>
    <header class="header">
      <span class="monogram">E</span>
      <div><strong id="event-name">Erika's Sweet 16</strong><small id="guest-drop">Guest memory drop</small></div>
      <button class="language-switch" id="language-switch" type="button" aria-label="Language">ES</button>
    </header>
    <section class="card">
      <div class="intro" id="intro">
        <h1><span id="share-title">Share a</span><br><em id="memory-title">memory.</em></h1>
        <p id="experience-copy">Share your experience for Erika.</p>
      </div>
      <form id="photo-form">
        <label class="picker" id="picker">
          <span class="prompt" id="prompt"><i>＋</i><strong id="choose-copy">Choose photos or videos</strong><small id="limit-copy">Upload up to 10 photos or videos at a time</small></span>
          <span class="previews" id="previews"><strong class="count" id="count"></strong></span>
          <input id="photos" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm,video/x-m4v" multiple disabled>
        </label>
        <button class="add-more" id="add-more" type="button" hidden>Add more photos or videos</button>
        <label class="field">
          <span><b id="name-label">Your name</b> <em id="name-optional">optional · private</em></span>
          <input id="guest-name" maxlength="80" placeholder="Add your name if you want" autocomplete="name" disabled>
          <small id="name-privacy">Your name will not appear with the photo or video.</small>
        </label>
        <label class="field">
          <span><b id="message-label">Message</b> <em id="message-optional">optional</em></span>
          <input id="caption" maxlength="140" placeholder="Add a short note about this moment" disabled>
        </label>
        <p class="message error" id="error" role="alert"></p>
        <button class="submit" id="submit" type="submit" disabled>Share this photo</button>
      </form>
      <section class="confirmation" id="confirmation" role="status" aria-live="polite" hidden>
        <span class="confirmation-icon" aria-hidden="true">✓</span>
        <small id="submitted-label">Submitted</small>
        <h2 id="confirmation-title">Your memories are in.</h2>
        <p id="confirmation-copy"></p>
        <button id="submit-another" type="button">Submit new photos or videos</button>
      </section>
    </section>
  </main>
  <script>
    const MAX_BATCH_FILES = 10;
    const copy = {
      en: {
        guestDrop: "Guest memory drop", shareTitle: "Share a", memory: "memory.", experience: "Share your experience for Erika.",
        choose: "Choose photos or videos", limit: "Upload up to 10 photos or videos at a time", addMore: "Add more photos or videos",
        yourName: "Your name", optionalPrivate: "optional · private", namePlaceholder: "Add your name if you want", namePrivacy: "Your name will not appear with the photo or video.",
        message: "Message", optional: "optional", messagePlaceholder: "Add a short note about this moment", paused: "Uploads are paused by the host.",
        unavailable: "Sharing is temporarily unavailable", uploadError: "Could not upload that photo or video", submitted: "Submitted",
        thanks: "Thank you for celebrating Erika!", submitMore: "Submit new photos or videos", memories: "memories", uploading: "Uploading",
        batchLimit: "You can upload up to 10 photos or videos at a time.", remaining: "Please try the remaining files again.",
      },
      es: {
        guestDrop: "Recuerdos de los invitados", shareTitle: "Comparte un", memory: "recuerdo.", experience: "Comparte tu experiencia para Erika.",
        choose: "Elige fotos o videos", limit: "Sube hasta 10 fotos o videos a la vez", addMore: "Agregar más fotos o videos",
        yourName: "Tu nombre", optionalPrivate: "opcional · privado", namePlaceholder: "Agrega tu nombre si quieres", namePrivacy: "Tu nombre no aparecerá con la foto o el video.",
        message: "Mensaje", optional: "opcional", messagePlaceholder: "Agrega una nota corta sobre este momento", paused: "El anfitrión ha pausado las cargas.",
        unavailable: "La página para compartir no está disponible por el momento", uploadError: "No se pudo subir esa foto o video", submitted: "Enviado",
        thanks: "¡Gracias por celebrar con Erika!", submitMore: "Subir más fotos o videos", memories: "recuerdos", uploading: "Subiendo",
        batchLimit: "Puedes subir hasta 10 fotos o videos a la vez.", remaining: "Intenta subir los archivos restantes de nuevo.",
      },
    };
    const languageGate = document.querySelector("#language-gate");
    const uploadPage = document.querySelector("#upload-page");
    const languageSwitch = document.querySelector("#language-switch");
    const input = document.querySelector("#photos");
    const form = document.querySelector("#photo-form");
    const intro = document.querySelector("#intro");
    const picker = document.querySelector("#picker");
    const prompt = document.querySelector("#prompt");
    const previews = document.querySelector("#previews");
    const count = document.querySelector("#count");
    const addMore = document.querySelector("#add-more");
    const guestName = document.querySelector("#guest-name");
    const caption = document.querySelector("#caption");
    const submit = document.querySelector("#submit");
    const errorMessage = document.querySelector("#error");
    const confirmation = document.querySelector("#confirmation");
    const confirmationTitle = document.querySelector("#confirmation-title");
    const confirmationCopy = document.querySelector("#confirmation-copy");
    const submitAnother = document.querySelector("#submit-another");
    let selectedFiles = [];
    let previewUrls = [];
    let uploadAllowed = false;
    let uploading = false;
    let language = null;

    function applyLanguage() {
      const text = copy[language];
      document.documentElement.lang = language;
      document.querySelector("#guest-drop").textContent = text.guestDrop;
      document.querySelector("#share-title").textContent = text.shareTitle;
      document.querySelector("#memory-title").textContent = text.memory;
      document.querySelector("#experience-copy").textContent = text.experience;
      document.querySelector("#choose-copy").textContent = text.choose;
      document.querySelector("#limit-copy").textContent = text.limit;
      addMore.textContent = text.addMore;
      document.querySelector("#name-label").textContent = text.yourName;
      document.querySelector("#name-optional").textContent = text.optionalPrivate;
      guestName.placeholder = text.namePlaceholder;
      document.querySelector("#name-privacy").textContent = text.namePrivacy;
      document.querySelector("#message-label").textContent = text.message;
      document.querySelector("#message-optional").textContent = text.optional;
      caption.placeholder = text.messagePlaceholder;
      document.querySelector("#submitted-label").textContent = text.submitted;
      submitAnother.textContent = text.submitMore;
      languageSwitch.textContent = language === "en" ? "ES" : "EN";
      languageSwitch.setAttribute("aria-label", language === "en" ? "Cambiar a español" : "Switch to English");
      renderSelection();
    }

    function chooseLanguage(nextLanguage) {
      language = nextLanguage;
      languageGate.hidden = true;
      uploadPage.hidden = false;
      showMessage(errorMessage, "");
      applyLanguage();
      loadEventDay();
    }

    function showMessage(element, message) {
      element.textContent = message;
      element.classList.toggle("visible", Boolean(message));
    }

    function clearPreviewUrls() {
      previewUrls.forEach((url) => URL.revokeObjectURL(url));
      previewUrls = [];
    }

    function renderSelection() {
      clearPreviewUrls();
      previews.querySelectorAll("img, .video-preview").forEach((preview) => preview.remove());
      selectedFiles.forEach((file, index) => {
        const url = URL.createObjectURL(file);
        previewUrls.push(url);
        if (file.type.startsWith("video/")) {
          const wrapper = document.createElement("span");
          wrapper.className = "video-preview";
          const video = document.createElement("video");
          video.src = url;
          video.muted = true;
          video.playsInline = true;
          video.preload = "metadata";
          video.setAttribute("aria-label", `${language === "es" ? "Video" : "Selected video"} ${index + 1} / ${selectedFiles.length}`);
          const badge = document.createElement("i");
          badge.textContent = language === "es" ? "Video" : "Video";
          wrapper.append(video, badge);
          previews.insertBefore(wrapper, count);
        } else {
          const image = document.createElement("img");
          image.src = url;
          image.alt = `${language === "es" ? "Foto" : "Selected photo"} ${index + 1} / ${selectedFiles.length}`;
          previews.insertBefore(image, count);
        }
      });
      const hasFiles = selectedFiles.length > 0;
      picker.classList.toggle("selected", hasFiles);
      prompt.hidden = hasFiles;
      previews.classList.toggle("visible", hasFiles);
      previews.classList.toggle("single", selectedFiles.length === 1);
      count.textContent = language === "es"
        ? selectedFiles.length === 1
          ? (selectedFiles[0].type.startsWith("video/") ? "1 video seleccionado" : "1 foto seleccionada")
          : `${selectedFiles.length} archivos seleccionados`
        : selectedFiles.length === 1
          ? `1 ${selectedFiles[0].type.startsWith("video/") ? "video" : "photo"} selected`
          : `${selectedFiles.length} memories selected`;
      addMore.hidden = !hasFiles;
      submit.disabled = !hasFiles || !uploadAllowed || uploading;
      if (!uploading && language) submit.textContent = language === "es"
        ? selectedFiles.length > 1
          ? `Compartir ${selectedFiles.length} recuerdos`
          : `Compartir ${selectedFiles[0]?.type.startsWith("video/") ? "este video" : "esta foto"}`
        : selectedFiles.length > 1
          ? `Share ${selectedFiles.length} memories`
          : `Share this ${selectedFiles[0]?.type.startsWith("video/") ? "video" : "photo"}`;
    }

    input.addEventListener("change", () => {
      const nextFiles = Array.from(input.files || []);
      const availableSlots = Math.max(0, MAX_BATCH_FILES - selectedFiles.length);
      selectedFiles = selectedFiles.concat(nextFiles.slice(0, availableSlots));
      input.value = "";
      showMessage(errorMessage, nextFiles.length > availableSlots
        ? copy[language].batchLimit
        : "");
      renderSelection();
    });

    addMore.addEventListener("click", () => input.click());

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!selectedFiles.length || !uploadAllowed || uploading) return;
      const batchSize = selectedFiles.length;
      const singleFileWasVideo = batchSize === 1 && selectedFiles[0].type.startsWith("video/");
      let completed = 0;
      uploading = true;
      input.disabled = true;
      addMore.disabled = true;
      showMessage(errorMessage, "");
      renderSelection();

      try {
        for (const file of selectedFiles) {
          submit.textContent = `${copy[language].uploading} ${completed + 1} / ${batchSize}…`;
          const response = await fetch("/api/photos", {
            method: "POST",
            headers: {
              "Content-Type": file.type,
              "X-File-Name": encodeURIComponent(file.name),
              "X-Guest-Name": encodeURIComponent(guestName.value),
              "X-Caption": encodeURIComponent(caption.value),
            },
            body: file,
          });
          const result = await response.json();
          if (!response.ok) throw new Error(language === "es" ? copy.es.uploadError : (result.error || copy.en.uploadError));
          completed += 1;
        }
        selectedFiles = [];
        caption.value = "";
        confirmationTitle.textContent = language === "es"
          ? batchSize === 1 ? (singleFileWasVideo ? "Tu video fue enviado." : "Tu foto fue enviada.") : "Tus recuerdos fueron enviados."
          : batchSize === 1 ? `Your ${singleFileWasVideo ? "video is" : "photo is"} in.` : "Your memories are in.";
        confirmationCopy.textContent = language === "es"
          ? batchSize === 1
            ? `Tu ${singleFileWasVideo ? "video" : "foto"} se compartió correctamente. ${copy.es.thanks}`
            : `Las ${batchSize} fotos y videos se compartieron correctamente. ${copy.es.thanks}`
          : batchSize === 1
            ? `Your ${singleFileWasVideo ? "video" : "photo"} was shared successfully. ${copy.en.thanks}`
            : `All ${batchSize} photos and videos were shared successfully. ${copy.en.thanks}`;
        intro.hidden = true;
        form.hidden = true;
        confirmation.hidden = false;
      } catch (error) {
        if (completed) selectedFiles = selectedFiles.slice(completed);
        const reason = error instanceof Error ? error.message : copy[language].uploadError;
        showMessage(errorMessage, completed
          ? language === "es"
            ? `${completed} de ${batchSize} recuerdos subidos. ${reason} ${copy.es.remaining}`
            : `${completed} of ${batchSize} memories uploaded. ${reason} ${copy.en.remaining}`
          : reason);
      } finally {
        uploading = false;
        input.disabled = !uploadAllowed;
        addMore.disabled = false;
        renderSelection();
      }
    });

    submitAnother.addEventListener("click", () => {
      selectedFiles = [];
      caption.value = "";
      showMessage(errorMessage, "");
      confirmation.hidden = true;
      intro.hidden = false;
      form.hidden = false;
      renderSelection();
    });

    function loadEventDay() {
      fetch("/api/event-day", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(copy[language].unavailable);
          return response.json();
        })
        .then((eventDay) => {
          if (eventDay.event?.eventName) document.querySelector("#event-name").textContent = eventDay.event.eventName;
          uploadAllowed = Boolean(eventDay.photoUploadsEnabled);
          input.disabled = !uploadAllowed;
          guestName.disabled = !uploadAllowed;
          caption.disabled = !uploadAllowed;
          renderSelection();
          if (!uploadAllowed) showMessage(errorMessage, copy[language].paused);
        })
        .catch((error) => showMessage(errorMessage, error.message || copy[language].unavailable));
    }

    document.querySelector("#choose-en").addEventListener("click", () => chooseLanguage("en"));
    document.querySelector("#choose-es").addEventListener("click", () => chooseLanguage("es"));
    languageSwitch.addEventListener("click", () => {
      uploadPage.hidden = true;
      languageGate.hidden = false;
      language = null;
      document.documentElement.lang = "en";
    });

    window.addEventListener("pagehide", clearPreviewUrls);
  </script>
</body>
</html>
